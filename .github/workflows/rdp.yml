name: Hardened Tailscale RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. Configure secure Windows RDP
      # ============================================================
      - name: Configure Secure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring Windows RDP..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" `
            -Value 2 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "MinEncryptionLevel" `
            -Value 3 `
            -Force

          Remove-NetFirewallRule -DisplayName "RDP-Tailscale" -ErrorAction SilentlyContinue

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -Profile Any

          Restart-Service -Name TermService -Force
          Write-Host "Secure RDP configuration completed."

      # ============================================================
      # 2. Create non-administrator RDP account
      # ============================================================
      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not $env:RDP_PASSWORD) {
              Write-Error "RDP_PASSWORD GitHub secret is missing."
              exit 1
          }

          Write-Output "::add-mask::$env:RDP_PASSWORD"

          $securePass = ConvertTo-SecureString$env:RDP_PASSWORD -AsPlainText -Force

          $existingUser = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue
          if ($existingUser) {
              Write-Host "Removing existing RDP account..."
              Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -Description "Temporary RDP user for Tailscale access" `
            -AccountNeverExpires `
            -PasswordNeverExpires `
            -UserMayNotChangePassword

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue)) {
              Write-Error "RDP user creation failed."
              exit 1
          }

          Write-Host "RDP user created successfully."

      # ============================================================
      # 3. Install Tailscale
      # ============================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $tempDir = [System.IO.Path]::GetTempPath()
          $installerPath =$tempDir + "tailscale.msi"

          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri $tsUrl -OutFile$installerPath

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer download failed."
              exit 1
          }

          Write-Host "Installing Tailscale..."
          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installerPath`" /quiet /norestart" -Wait -PassThru -NoNewWindow

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed with exit code $($process.ExitCode)"
              exit $process.ExitCode
          }

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          & $tailscale version
          Write-Host "Tailscale installed successfully."

      # ============================================================
      # 4. Connect runner to Tailscale
      # ============================================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY secret is missing."
              exit 1
          }

          Write-Output "::add-mask::$env:TAILSCALE_AUTH_KEY"
          Write-Host "Connecting to Tailscale..."

          & $tailscale up --authkey="$env:TAILSCALE_AUTH_KEY" --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."
          $tsIP =$null

          for ($i = 1; $i -le 20; $i++) {$tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1).Trim()
              if ($tsIP) { break }
              Write-Host "Waiting for Tailscale IP... $i/20"
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              & $tailscale status
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IP: $tsIP"

      # ============================================================
      # 5. Verify secure RDP configuration
      # ============================================================
      - name: Security Verification
        shell: pwsh
        run: |
          Write-Host "Running security checks..."
          $portTest = Test-NetConnection -ComputerName "127.0.0.1" -Port 3389 -WarningAction SilentlyContinue

          if (-not $portTest.TcpTestSucceeded) {
              Write-Error "RDP port 3389 is not listening."
              exit 1
          }
          Write-Host "SECURITY CHECK PASSED: RDP is listening on port 3389."

      # ============================================================
      # 6. Display connection information WITHOUT password
      # ============================================================
      - name: Display RDP Connection Information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RDP ACCESS INFORMATION"
          Write-Host "=========================================="
          Write-Host "Address:  $env:TAILSCALE_IP"
          Write-Host "Port:     3389"
          Write-Host "Username: RDP"
          Write-Host "Password: GitHub Secret RDP_PASSWORD"
          Write-Host "=========================================="

      # ============================================================
      # 7. Keep runner alive
      # ============================================================
      - name: Maintain RDP Session
        shell: pwsh
        run: |
          Write-Host "RDP session is active. Staying alive..."
          while ($true) {
              Start-Sleep -Seconds 300
          }
