name: Windows RDP via Tailscale

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Secrets Are Set
        run: |
          if ("${{ secrets.RDP_USERNAME }}" -eq "") {
              Write-Error "CRITICAL: RDP_USERNAME secret is missing from repository settings!"
              exit 1
          }
          if ("${{ secrets.RDP_PASSWORD }}" -eq "") {
              Write-Error "CRITICAL: RDP_PASSWORD secret is missing from repository settings!"
              exit 1
          }
          if ("${{ secrets.TAILSCALE_AUTH_KEY }}" -eq "") {
              Write-Error "CRITICAL: TAILSCALE_AUTH_KEY secret is missing from repository settings!"
              exit 1
          }
          Write-Host "All secrets are present."

      - name: Enable Remote Desktop (RDP)
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

      - name: Create RDP User
        run: |
          $securePass = ConvertTo-SecureString "${{ secrets.RDP_PASSWORD }}" -AsPlainText -Force
          New-LocalUser -Name "${{ secrets.RDP_USERNAME }}" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "${{ secrets.RDP_USERNAME }}"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "${{ secrets.RDP_USERNAME }}"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-unsigned.exe"
          $installerPath = "$env:TEMP\tailscale-setup.exe"
          
          # Bulletproof download method using .NET WebClient
          $webClient = New-Object System.Net.WebClient
          $webClient.DownloadFile($tsUrl,$installerPath)
          
          Start-Process $installerPath -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Ensure Tailscale Service is Running
        run: |
          $serviceName = "Tailscale"
          $timeout = 30$elapsed = 0
          while ((Get-Service -Name $serviceName -ErrorAction SilentlyContinue).Status -ne 'Running') {
              Write-Host "Waiting for Tailscale service to start..."
              Start-Sleep -Seconds 3
              $elapsed += 3
              if ($elapsed -ge$timeout) {
                  Write-Error "Tailscale service failed to start within $timeout seconds."
                  exit 1
              }
          }
          Write-Host "Tailscale service is running."

      - name: Connect to Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID$tsIP = $null$retries = 0
          while (-not $tsIP -and$retries -lt 15) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              if (-not $tsIP) { Start-Sleep -Seconds 5 }$retries++
          }
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned after multiple attempts."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Output RDP Connection Details
        run: |
          Write-Host "`n=========================================="
          Write-Host " RDP IS READY TO CONNECT!"
          Write-Host " Tailscale IP : $env:TAILSCALE_IP"
          Write-Host " Username     : ${{ secrets.RDP_USERNAME }}"
          Write-Host "==========================================`n"

      - name: Keep Runner Alive
        run: |
          Write-Host "Keeping job alive. Cancel workflow manually when done."
          while ($true) {
              Start-Sleep -Seconds 300
          }
